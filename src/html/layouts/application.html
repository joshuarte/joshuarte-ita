<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="google-adsense-account" content="ca-pub-7716592172266156" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ description }}" />
    <meta name="author" content="{{ author }}" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="{{ogType.url}}" />
    
    <!-- Open Graph Protocol -->
    <meta property="og:title" content="{{ogType.title}}" />
    <meta property="og:description" content="{{ogType.description}}" />
    <meta property="og:url" content="{{ogType.url}}" />
    <meta property="og:image" content="{{ogType.image}}" />
    <meta property="og:type" content="website" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ogType.title}}" />
    <meta name="twitter:description" content="{{ogType.description}}" />
    <meta name="twitter:image" content="{{ogType.image}}" />
    
    <title>{{title}}</title>
    
    <!-- Preload strategico delle immagini per LCP -->
    <link rel="preload" as="image" imagesrcset="/images/bg.avif" type="image/avif" fetchpriority="high">
    <link rel="preload" as="image" imagesrcset="/images/bg.webp" type="image/webp" fetchpriority="high">
    <link rel="preload" as="image" href="/images/bg.jpg" fetchpriority="high">
    
    <!-- Font loading ottimizzato -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Utilizziamo font-display: swap per evitare render-blocking -->
    <style>
      /* Stile inline per font fallback */
      @font-face {
        font-family: 'Source Sans Pro';
        font-style: normal;
        font-weight: 300;
        font-display: swap;
        src: local('Source Sans Pro Light'), local('SourceSansPro-Light');
      }
      @font-face {
        font-family: 'Source Sans Pro';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: local('Source Sans Pro Regular'), local('SourceSansPro-Regular');
      }
      @font-face {
        font-family: 'Source Sans Pro';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: local('Source Sans Pro SemiBold'), local('SourceSansPro-SemiBold');
      }
    </style>
    <!-- Font caricato in modo non bloccante -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600&display=swap">
    </noscript>
    
    <!-- Stili critici per il loader -->
    {% include "shared/critical-styles.njk" %}
    
    <!-- Stili non critici caricati in modo non bloccante -->
    <link rel="preload" href="stylesheets/app.css" as="style">
    <link rel="stylesheet" href="stylesheets/app.css" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="stylesheets/app.css">
    </noscript>
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Luca Joshua Mosca",
      "url": "{{ogType.url}}",
      "jobTitle": "Senior Developer e Game Designer",
      "knowsAbout": ["Frontend Development", "Game Design", "UI/UX", "Web Development"],
      "sameAs": [
        "https://discordapp.com/channels/@joshuarte",
        "https://it.linkedin.com/in/joshuarte"
      ]
    }
    </script>
    
    <!-- Google Analytics -->
    <script defer src="https://www.googletagmanager.com/gtag/js?id=G-W7H28M8MDY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag("js", new Date());
      gtag("config", "G-W7H28M8MDY");
    </script>
    
    <!-- AdSense -->
    <script defer src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7716592172266156" crossorigin="anonymous"></script>
    
    <!-- Cookie script con HTTPS -->
    <script defer src="https://www.joshuarte.it/cookie.js"></script>

    {% include "shared/app-icons.html" %}
    {% block head %}{% endblock %}
  </head>

  <body id="page-top" data-module="ctrl">
    <div class="loader"></div>
    
    <main>
      {% block content %}{% endblock %}
    </main>
    
    {% block javascript %}{% endblock %}

    <!-- Script modulare -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
